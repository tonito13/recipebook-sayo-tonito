<!DOCTYPE html>
<html>
<head>
    <title>{{ recipe.name }}</title>
</head>
<body>
    <h1>{{ recipe.name }}</h1>
    <ul>
        {% for recipeingredient in recipe.recipeingredient_set.all %}
            <li>{{ recipeingredient.quantity }} - {{ recipeingredient.ingredient.name }}</li>
        {% endfor %}
    </ul>
    <a href="{% url 'recipe-list' %}">Back to recipes</a>
</body>
</html>
